name: Physics Sim KPI

on:
  pull_request:
    paths:
      - "physics_sim/**"
      # The harness imports all of these. A permissions bug in utils/ reached
      # through playbalance/ crashed it on import, and a change confined to
      # either would never have triggered this check.
      - "playbalance/**"
      - "utils/**"
      - "models/**"
      - "scripts/physics_sim_season_kpis.py"
      - "scripts/kpi_extras.py"
      - "scripts/kpi_profiles/**"
      - "scripts/generate_calibration_roster.py"
      - "data/calibration/**"
      - "data/calibration_league/**"
      - "scripts/generate_league_fixture.py"
      - "data/MLB_avg/**"
      - ".github/workflows/physics_sim_kpi.yml"
  push:
    branches: [main]
    paths:
      - "physics_sim/**"
      # The harness imports all of these. A permissions bug in utils/ reached
      # through playbalance/ crashed it on import, and a change confined to
      # either would never have triggered this check.
      - "playbalance/**"
      - "utils/**"
      - "models/**"
      - "scripts/physics_sim_season_kpis.py"
      - "scripts/kpi_extras.py"
      - "scripts/kpi_profiles/**"
      - "scripts/generate_calibration_roster.py"
      - "data/calibration/**"
      - "data/calibration_league/**"
      - "scripts/generate_league_fixture.py"
      - "data/MLB_avg/**"
      - ".github/workflows/physics_sim_kpi.yml"
  workflow_dispatch:

jobs:
  physics-sim-kpis:
    runs-on: ubuntu-latest
    # Four 162-game seasons in sequence: two strict on the legacy engine, one
    # strict on engine generation 5 and one, not blocking yet, on generation
    # 6 (the report-only league step reuses the running-game step's season).
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # The engine's production dependencies, matching the Cloud Run image.
        # requirements.txt was renamed to requirements-dev.txt in August 2025
        # and that one carries torch/diffusers/transformers the harness never
        # touches. Nobody noticed the stale name because checkout failed first.
        run: python -m pip install -r requirements-server.txt
      - name: Run KPI harness (strict, calibration fixture)
        env:
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p tmp
          set -o pipefail
          if ! python scripts/physics_sim_season_kpis.py \
              --games 162 \
              --seed 1 \
              --base-dir data/calibration \
              --players data/calibration/players.csv \
              --output tmp/physics_kpis.json \
              --strict 2>&1 | tee tmp/kpi_run.log; then
            # Say WHY in an annotation. Annotations appear in the run summary
            # and the failure email; the raw log needs a login. Which gates
            # failed (from the report, if one was written), then the log tail.
            {
              if [ -f tmp/physics_kpis.json ]; then
                python -c "import json; d=json.load(open('tmp/physics_kpis.json')); [print(f\"{f['metric']}: {f['value']:.4f} (target {f['target']} +/- {f['tolerance']})\") for f in d.get('tolerance_failures', [])]"
              fi
              echo "--- last lines of output ---"
              tail -n 40 tmp/kpi_run.log
            } > tmp/kpi_failure.txt
            msg=$(sed -e 's/%/%25/g' -e 's/\r//g' tmp/kpi_failure.txt | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=KPI harness failed::${msg}"
            exit 1
          fi
      - name: Upload KPI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-kpis
          path: tmp/physics_kpis.json
      - name: Run KPI harness (strict running game, league-like fixture)
        # Release 4. data/calibration_league is the speed-tier fixture (ACT
        # mean sp 54.4, burners at 70+ and 85+), the only one that exercises
        # the running game across the rating range. --gate-set running fails
        # the job on the running-game gates only (steal volume and success,
        # WP/PB, triples, the rule zero gates and, since Release 4b became
        # the default, extra bases taken and SF/PA); its offence gates stay
        # report-only, as in the last step. A listed gate that was not
        # computed fails too. Runs even when the step above failed.
        if: ${{ !cancelled() }}
        env:
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p tmp
          set -o pipefail
          if ! python scripts/physics_sim_season_kpis.py \
              --games 162 \
              --seed 1 \
              --base-dir data/calibration_league \
              --players data/calibration_league/players.csv \
              --gate-set running \
              --output tmp/physics_kpis_league_running.json \
              --strict 2>&1 | tee tmp/kpi_league_running.log; then
            # Annotate as above, from the gate set's own failure list.
            {
              if [ -f tmp/physics_kpis_league_running.json ]; then
                python -c "import json; d=json.load(open('tmp/physics_kpis_league_running.json')); [print(f\"{f['metric']}: {f['value']:.4f} (target {f['target']} +/- {f['tolerance']}) {f.get('reason', '')}\") for f in d.get('gate_set', {}).get('failures', [])]"
              fi
              echo "--- last lines of output ---"
              tail -n 40 tmp/kpi_league_running.log
            } > tmp/kpi_league_running_failure.txt
            msg=$(sed -e 's/%/%25/g' -e 's/\r//g' tmp/kpi_league_running_failure.txt | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=KPI running-game gates failed (league-like fixture)::${msg}"
            exit 1
          fi
      - name: Upload league running-game KPI report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: physics-kpis-league-running
          path: tmp/physics_kpis_league_running.json
          if-no-files-found: warn
      - name: Run KPI harness (strict, engine generation 5)
        # Release 5. The steps above run the legacy engine every league
        # plays today (no --engine). This one runs engine generation 5
        # (physics_sim/profiles/engine_5.json over the defaults) so the path
        # a league takes at its next season is gated too: the full strict
        # set against generation 5's own references (ENGINE_GATES in the
        # harness: Statcast chase rate, starters-only TTO gap, the platoon
        # gap back at +/- .006, swing rate at each count, intentional walks,
        # the home edge). Blocking since it passed on this runner with
        # 7.51.0 (it was continue-on-error until then, because the runner
        # could have rolled a different season than the machine the profile
        # was tuned on).
        if: ${{ !cancelled() }}
        env:
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p tmp
          set -o pipefail
          if ! python scripts/physics_sim_season_kpis.py \
              --games 162 \
              --seed 1 \
              --base-dir data/calibration \
              --players data/calibration/players.csv \
              --engine 5 \
              --output tmp/physics_kpis_engine5.json \
              --strict 2>&1 | tee tmp/kpi_engine5.log; then
            {
              if [ -f tmp/physics_kpis_engine5.json ]; then
                python -c "import json; d=json.load(open('tmp/physics_kpis_engine5.json')); [print(f\"{f['metric']}: {f['value']:.4f} (target {f['target']} +/- {f['tolerance']}) {f.get('reason', '')}\") for f in d.get('tolerance_failures', [])]"
              fi
              echo "--- last lines of output ---"
              tail -n 40 tmp/kpi_engine5.log
            } > tmp/kpi_engine5_failure.txt
            msg=$(sed -e 's/%/%25/g' -e 's/\r//g' tmp/kpi_engine5_failure.txt | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=KPI engine generation 5 gates failed::${msg}"
            exit 1
          fi
      - name: Upload engine generation 5 KPI report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: physics-kpis-engine5
          path: tmp/physics_kpis_engine5.json
          if-no-files-found: warn
      - name: Run KPI harness (strict, engine generation 6; not blocking yet)
        # 8.0.0. Engine generation 6 (physics_sim/profiles/engine_6.json), the
        # engine a league moves to with the rating-scale switch, against its
        # own references (ENGINE_GATES[6]: generation 5's plus the pitching,
        # power and fielding gates; ISO at .150; the slopes that are gated
        # over seeds are report-only here). NOT BLOCKING YET
        # (continue-on-error): it becomes blocking once it has passed on this
        # runner, as generation 5's step did with 7.51.0, because the runner
        # could roll a different season than the machine the profile was
        # tuned on.
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p tmp
          set -o pipefail
          if ! python scripts/physics_sim_season_kpis.py \
              --games 162 \
              --seed 1 \
              --base-dir data/calibration \
              --players data/calibration/players.csv \
              --engine 6 \
              --output tmp/physics_kpis_engine6.json \
              --strict 2>&1 | tee tmp/kpi_engine6.log; then
            {
              if [ -f tmp/physics_kpis_engine6.json ]; then
                python -c "import json; d=json.load(open('tmp/physics_kpis_engine6.json')); [print(f\"{f['metric']}: {f['value']:.4f} (target {f['target']} +/- {f['tolerance']}) {f.get('reason', '')}\") for f in d.get('tolerance_failures', [])]"
              fi
              echo "--- last lines of output ---"
              tail -n 40 tmp/kpi_engine6.log
            } > tmp/kpi_engine6_failure.txt
            msg=$(sed -e 's/%/%25/g' -e 's/\r//g' tmp/kpi_engine6_failure.txt | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::warning title=KPI engine generation 6 gates failed (not blocking yet)::${msg}"
            exit 1
          fi
      - name: Upload engine generation 6 KPI report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: physics-kpis-engine6
          path: tmp/physics_kpis_engine6.json
          if-no-files-found: warn
      - name: Run KPI harness (report-only, league-like fixture)
        # Audit 2026-10-06 H3 / Release 2. data/calibration_league is built by
        # scripts/generate_league_fixture.py from the product's own generator,
        # auto-assign and auto-fill, in generic parks -- what a real league
        # looks like. The current engine fails gates on it by design, so this
        # step is REPORT-ONLY: no --strict, never fails the job, and runs even
        # when the strict steps above failed. Promote it to a gate once the
        # engine releases bring it inside tolerance (its running game already
        # gates: the --gate-set running step above).
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p tmp
          # The running-game step above simulates this exact season (same
          # fixture, seed and tuning; a gate set only filters failures), so
          # reuse its report instead of re-simulating it.
          if [ -f tmp/physics_kpis_league_running.json ]; then
            cp tmp/physics_kpis_league_running.json tmp/physics_kpis_league_fixture.json
          else
            python scripts/physics_sim_season_kpis.py \
                --games 162 \
                --seed 1 \
                --base-dir data/calibration_league \
                --players data/calibration_league/players.csv \
                --output tmp/physics_kpis_league_fixture.json
          fi
          python -c "import json; d=json.load(open('tmp/physics_kpis_league_fixture.json')); m=d['metrics']; f=d.get('tolerance_failures', []); print(f\"::notice title=League-like fixture (report-only)::R/G {m['runs_per_team_game']:.2f}, AVG/OBP/SLG {m['avg']:.3f}/{m['obp']:.3f}/{m['slg']:.3f}; {len(f)} gates out of tolerance: {', '.join(x['metric'] for x in f) or 'none'}\")"
      - name: Upload league-like fixture KPI report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: physics-kpis-league-fixture
          path: tmp/physics_kpis_league_fixture.json
          if-no-files-found: warn
