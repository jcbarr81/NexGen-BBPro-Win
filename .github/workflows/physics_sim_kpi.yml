name: Physics Sim KPI

on:
  pull_request:
    paths:
      - "physics_sim/**"
      # The harness imports all of these. A permissions bug in utils/ reached
      # through playbalance/ crashed it on import, and a change confined to
      # either would never have triggered this check.
      - "playbalance/**"
      - "utils/**"
      - "models/**"
      - "scripts/physics_sim_season_kpis.py"
      - "scripts/kpi_extras.py"
      - "scripts/generate_calibration_roster.py"
      - "data/calibration/**"
      - "data/calibration_league/**"
      - "scripts/generate_league_fixture.py"
      - "data/MLB_avg/**"
      - ".github/workflows/physics_sim_kpi.yml"
  push:
    branches: [main]
    paths:
      - "physics_sim/**"
      # The harness imports all of these. A permissions bug in utils/ reached
      # through playbalance/ crashed it on import, and a change confined to
      # either would never have triggered this check.
      - "playbalance/**"
      - "utils/**"
      - "models/**"
      - "scripts/physics_sim_season_kpis.py"
      - "scripts/kpi_extras.py"
      - "scripts/generate_calibration_roster.py"
      - "data/calibration/**"
      - "data/calibration_league/**"
      - "scripts/generate_league_fixture.py"
      - "data/MLB_avg/**"
      - ".github/workflows/physics_sim_kpi.yml"
  workflow_dispatch:

jobs:
  physics-sim-kpis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # The engine's production dependencies, matching the Cloud Run image.
        # requirements.txt was renamed to requirements-dev.txt in August 2025
        # and that one carries torch/diffusers/transformers the harness never
        # touches. Nobody noticed the stale name because checkout failed first.
        run: python -m pip install -r requirements-server.txt
      - name: Run KPI harness (strict, calibration fixture)
        env:
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p tmp
          set -o pipefail
          if ! python scripts/physics_sim_season_kpis.py \
              --games 162 \
              --seed 1 \
              --base-dir data/calibration \
              --players data/calibration/players.csv \
              --output tmp/physics_kpis.json \
              --strict 2>&1 | tee tmp/kpi_run.log; then
            # Say WHY in an annotation. Annotations appear in the run summary
            # and the failure email; the raw log needs a login. Which gates
            # failed (from the report, if one was written), then the log tail.
            {
              if [ -f tmp/physics_kpis.json ]; then
                python -c "import json; d=json.load(open('tmp/physics_kpis.json')); [print(f\"{f['metric']}: {f['value']:.4f} (target {f['target']} +/- {f['tolerance']})\") for f in d.get('tolerance_failures', [])]"
              fi
              echo "--- last lines of output ---"
              tail -n 40 tmp/kpi_run.log
            } > tmp/kpi_failure.txt
            msg=$(sed -e 's/%/%25/g' -e 's/\r//g' tmp/kpi_failure.txt | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=KPI harness failed::${msg}"
            exit 1
          fi
      - name: Upload KPI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-kpis
          path: tmp/physics_kpis.json
      - name: Run KPI harness (report-only, league-like fixture)
        # Audit 2026-10-06 H3 / Release 2. data/calibration_league is built by
        # scripts/generate_league_fixture.py from the product's own generator,
        # auto-assign and auto-fill, in generic parks -- what a real league
        # looks like. The current engine fails gates on it by design, so this
        # step is REPORT-ONLY: no --strict, never fails the job, and runs even
        # when the strict step above failed. Promote it to a gate once the
        # engine releases bring it inside tolerance.
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p tmp
          python scripts/physics_sim_season_kpis.py \
              --games 162 \
              --seed 1 \
              --base-dir data/calibration_league \
              --players data/calibration_league/players.csv \
              --output tmp/physics_kpis_league_fixture.json
          python -c "import json; d=json.load(open('tmp/physics_kpis_league_fixture.json')); m=d['metrics']; f=d.get('tolerance_failures', []); print(f\"::notice title=League-like fixture (report-only)::R/G {m['runs_per_team_game']:.2f}, AVG/OBP/SLG {m['avg']:.3f}/{m['obp']:.3f}/{m['slg']:.3f}; {len(f)} gates out of tolerance: {', '.join(x['metric'] for x in f) or 'none'}\")"
      - name: Upload league-like fixture KPI report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: physics-kpis-league-fixture
          path: tmp/physics_kpis_league_fixture.json
          if-no-files-found: warn
