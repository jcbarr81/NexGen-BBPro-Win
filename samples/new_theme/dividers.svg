<?xml version="1.0" encoding="UTF-8"?>
<!--
  NexGen BBPro — Decorative SVG Assets
  File: dividers.svg

  Usage in PyQt6 (set as QLabel pixmap or stylesheet background-image):
    label.setPixmap(QPixmap("assets/graphics/dividers.svg")
        .scaled(width, height, Qt.KeepAspectRatio, Qt.SmoothTransformation))

  Or reference individual elements in QSS:
    border-image: url(assets/graphics/divider_warm.svg) 0 0 0 0;
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- WARM THEME ASSETS                                                   -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <!-- Warm section divider — amber ruled line with diamond ornament -->
  <g id="divider-warm" transform="translate(0, 20)">
    <line x1="0" y1="10" x2="370" y2="10" stroke="#604d33" stroke-width="1"/>
    <polygon points="400,2 412,10 400,18 388,10" fill="#F59E0B"/>
    <line x1="430" y1="10" x2="800" y2="10" stroke="#604d33" stroke-width="1"/>
  </g>

  <!-- Warm card header band — gradient strip with amber bottom line -->
  <g id="card-header-warm" transform="translate(0, 60)">
    <defs>
      <linearGradient id="hdrGradWarm" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#7a6450;stop-opacity:1"/>
        <stop offset="100%" style="stop-color:#604d33;stop-opacity:1"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="800" height="38" fill="url(#hdrGradWarm)" rx="2"/>
    <line x1="0" y1="38" x2="800" y2="38" stroke="#F59E0B" stroke-width="1.5"/>
    <!-- Subtle top highlight -->
    <line x1="0" y1="0.5" x2="800" y2="0.5" stroke="rgba(255,253,240,0.15)" stroke-width="1"/>
  </g>

  <!-- Warm stat tile — raised inset box for metric display -->
  <g id="stat-tile-warm" transform="translate(0, 120)">
    <defs>
      <linearGradient id="tileGradWarm" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#7a6450;stop-opacity:1"/>
        <stop offset="100%" style="stop-color:#604d33;stop-opacity:1"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="160" height="72" rx="8" fill="url(#tileGradWarm)"/>
    <!-- top highlight edge -->
    <rect x="0" y="0" width="160" height="1" rx="0" fill="rgba(255,253,240,0.2)"/>
    <!-- bottom shadow edge -->
    <rect x="0" y="70" width="160" height="2" rx="1" fill="rgba(0,0,0,0.4)"/>
    <!-- amber left accent bar -->
    <rect x="0" y="8" width="3" height="56" rx="1.5" fill="#F59E0B"/>
    <!-- label area -->
    <rect x="10" y="10" width="90" height="10" rx="2" fill="rgba(255,253,240,0.2)"/>
    <!-- value area -->
    <rect x="10" y="26" width="120" height="28" rx="3" fill="rgba(255,253,240,0.08)"/>
  </g>

  <!-- Warm action button — raised dugout tile style -->
  <g id="action-btn-warm" transform="translate(0, 220)">
    <defs>
      <linearGradient id="btnGradWarm" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#7a6450;stop-opacity:1"/>
        <stop offset="100%" style="stop-color:#604d33;stop-opacity:1"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="180" height="44" rx="8" fill="url(#btnGradWarm)"/>
    <!-- top highlight -->
    <rect x="1" y="1" width="178" height="1" rx="0.5" fill="rgba(255,253,240,0.18)"/>
    <!-- bottom shadow -->
    <rect x="0" y="42" width="180" height="3" rx="1.5" fill="rgba(0,0,0,0.35)"/>
  </g>

  <!-- Warm sidebar nav item — active state -->
  <g id="nav-item-active-warm" transform="translate(0, 290)">
    <defs>
      <linearGradient id="navGradWarm" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:rgba(96,77,51,0.9)"/>
        <stop offset="100%" style="stop-color:rgba(96,77,51,0.3)"/>
      </linearGradient>
    </defs>
    <rect x="8" y="0" width="200" height="42" rx="8" fill="url(#navGradWarm)"/>
    <!-- amber left accent -->
    <rect x="8" y="4" width="3" height="34" rx="1.5" fill="#F59E0B"/>
    <!-- top and bottom border hints -->
    <line x1="11" y1="0.5" x2="208" y2="0.5" stroke="rgba(255,253,240,0.1)" stroke-width="1"/>
    <line x1="11" y1="41.5" x2="208" y2="41.5" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- NEWSPAPER THEME ASSETS                                              -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <!-- Newspaper section divider — double rule with serif ornament -->
  <g id="divider-newspaper-light" transform="translate(0, 360)">
    <line x1="0" y1="4" x2="800" y2="4" stroke="#0a0a0a" stroke-width="2.5"/>
    <line x1="0" y1="10" x2="800" y2="10" stroke="#0a0a0a" stroke-width="0.8"/>
    <!-- masthead ornaments -->
    <text x="380" y="22" font-family="Georgia, serif" font-size="14" fill="#0a0a0a"
          text-anchor="middle" letter-spacing="4">✦</text>
  </g>

  <!-- Newspaper card header — bold black ink rule -->
  <g id="card-header-newspaper-light" transform="translate(0, 400)">
    <rect x="0" y="0" width="800" height="36" fill="#0a0a0a"/>
    <!-- reversed-out white area for text placement -->
    <rect x="3" y="3" width="794" height="30" fill="none" stroke="rgba(248,246,240,0.1)" stroke-width="0.5"/>
    <!-- bottom red rule -->
    <rect x="0" y="36" width="800" height="2" fill="#C8102E"/>
  </g>

  <!-- Newspaper action button — outlined ink style -->
  <g id="action-btn-newspaper-light" transform="translate(0, 460)">
    <rect x="0" y="0" width="180" height="44" rx="0" fill="#f4f0e6"
          stroke="#0a0a0a" stroke-width="2"/>
    <!-- inner inset line for editorial feel -->
    <rect x="3" y="3" width="174" height="38" rx="0" fill="none"
          stroke="rgba(10,10,10,0.12)" stroke-width="0.5"/>
  </g>

  <!-- Newspaper sidebar nav item — active state -->
  <g id="nav-item-active-newspaper" transform="translate(0, 530)">
    <rect x="8" y="0" width="200" height="40" rx="0" fill="rgba(200,16,46,0.12)"/>
    <!-- red left accent bar -->
    <rect x="8" y="0" width="3" height="40" fill="#C8102E"/>
    <!-- bottom rule -->
    <line x1="11" y1="39.5" x2="208" y2="39.5" stroke="rgba(248,246,240,0.08)" stroke-width="0.5"/>
  </g>

  <!-- Newspaper divider — dark theme version (white rules) -->
  <g id="divider-newspaper-dark" transform="translate(450, 360)">
    <line x1="0" y1="4" x2="350" y2="4" stroke="rgba(248,246,240,0.7)" stroke-width="2"/>
    <line x1="0" y1="10" x2="350" y2="10" stroke="rgba(248,246,240,0.25)" stroke-width="0.8"/>
    <text x="175" y="22" font-family="Georgia, serif" font-size="14"
          fill="rgba(248,246,240,0.5)" text-anchor="middle" letter-spacing="4">✦</text>
  </g>

</svg>
